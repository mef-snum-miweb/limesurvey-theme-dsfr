name: Release ZIP

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  package-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout au tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Extraire la version du tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Une pré-release (v1.15.0-rc1) porte le même config.xml que la version
          # finale : on compare sur la partie numérique, et on marque la release
          # GitHub comme pre-release pour qu'elle ne devienne pas « latest ».
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=${VERSION%%-*}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          fi

      - name: Vérifier que config.xml correspond au tag
        run: |
          CONFIG_VERSION=$(sed -n 's/.*<version>\([^<]*\)<\/version>.*/\1/p' config.xml | head -1)
          if [[ "$CONFIG_VERSION" != "${{ steps.ver.outputs.base }}" ]]; then
            echo "::error::config.xml indique version $CONFIG_VERSION mais le tag vise ${{ steps.ver.outputs.base }}. Bumpez config.xml AVANT de tagger."
            exit 1
          fi

      - name: Packager le ZIP
        run: ./release.sh "${{ steps.ver.outputs.version }}" --package-only

      - name: Uploader vers la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="dist/dsfr-${{ steps.ver.outputs.version }}.zip"
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "$ZIP" --clobber
          else
            gh release create "${{ github.ref_name }}" "$ZIP" \
              --title "${{ github.ref_name }}" \
              ${{ steps.ver.outputs.prerelease }} \
              --generate-notes
          fi
